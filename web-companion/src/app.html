<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Strict CSP; scripts/csp.mjs pins the SvelteKit bootstrap's hash
		     into script-src post-build. Styles keep 'unsafe-inline' (the
		     shell has a style attribute; styles cannot execute script). -->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'"
		/>
		<meta name="description" content="Smart Door Web Companion" />
		<title>Smart Door Web Companion</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
