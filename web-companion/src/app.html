<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- scripts/csp.mjs pins the SvelteKit bootstrap hash into script-src;
		     styles keep 'unsafe-inline' (style attr; no script exec). -->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'"
		/>
		<meta name="description" content="Smart Door Web Companion" />
		<title>Smart Door Web Companion</title>
		<script>
			// Pre-paint theme application: stored choice, else the system
			// colour scheme (dark -> dark, light -> axolotl). Must stay in
			// sync with src/lib/state/theme.svelte.ts. scripts/csp.mjs pins
			// this inline script's SHA-256 into script-src at build time.
			(function () {
				var t = null;
				try {
					t = localStorage.getItem('sdf-theme');
				} catch (e) {}
				if (t !== 'dark' && t !== 'axolotl') {
					try {
						t = window.matchMedia('(prefers-color-scheme: light)').matches
							? 'axolotl'
							: 'dark';
					} catch (e) {
						t = 'dark';
					}
				}
				document.documentElement.setAttribute('data-theme', t);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
